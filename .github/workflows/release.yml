name: Release module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build markdown.lua
        run: |
          bun ./build.ts

      - name: Release markdown.lua
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: markdown.lua
          files: |
            dist/markdown.lua
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
